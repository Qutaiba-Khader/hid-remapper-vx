name: release
on:
  push:
    tags: 'r*'
jobs:
  build-nrf52:
    uses: ./.github/workflows/build-nrf52.yml
  build-rp2040:
    uses: ./.github/workflows/build-rp2040.yml
  # Pico W Bluetooth remapper. ADDITIVE: it produces new .uf2 files and does not touch any
  # existing one -- every other board is built by the two workflows above, unchanged.
  build-picow:
    uses: ./.github/workflows/build-picow.yml
  # IR output. ADDITIVE in the same way: -DIR_OUTPUT_ENABLED is OFF by default, so this job only
  # adds remapper_ir.uf2 + remapper_picow_ble_ir.uf2. Every stock .uf2 stays byte-identical.
  # Without this job the web tool's IR download buttons 404 on releases/latest/download/.
  build-ir:
    uses: ./.github/workflows/build-ir.yml
  create-release:
    needs: [ build-nrf52, build-rp2040, build-picow, build-ir ]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: download
          merge-multiple: true
      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          draft: true
          files: download/*
