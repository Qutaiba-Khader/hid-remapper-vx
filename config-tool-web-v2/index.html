<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HID Remapper VX — Web Config</title>
  <!-- Every local css/js asset is stamped ?v=<date>. GitHub Pages serves them with a ~10 minute
       cache, so without this a deploy does not reach the browser until the cache expires — you
       keep looking at the previous build and think nothing shipped. BUMP THIS ON EVERY DEPLOY. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Bootstrap was inherited from the design mock and is NOT used: no Bootstrap JS API call and
       no Bootstrap class anywhere in the app. Worse, it was actively harmful — its own
       `.toast:not(.show){display:none}` (specificity 0-2-0) beat our `.toast{display:flex}` (0-1-0),
       so EVERY toast in the tool was invisible. Toasts are the only feedback channel, so failed
       saves and errors passed silently. Removed. -->
  <link rel="stylesheet" href="css/app.css?v=2026-07-13k">
  <link rel="stylesheet" href="css/mappings.css?v=2026-07-13k">
  <link rel="stylesheet" href="css/expressions.css?v=2026-07-13k">
  <link rel="stylesheet" href="css/settings.css?v=2026-07-13k">
</head>
<body>
  <div id="app"></div>

  <script src="js/usages.js?v=2026-07-13k"></script>
  <script src="js/state.js?v=2026-07-13k"></script>
  <script src="js/crc.js?v=2026-07-13k"></script>
  <script src="js/device.js?v=2026-07-13k"></script>
  <script src="js/translate.js?v=2026-07-13k"></script>
  <script src="js/icons.js?v=2026-07-13k"></script>
  <script src="js/core.js?v=2026-07-13k"></script>
  <script src="js/anim.js?v=2026-07-13k"></script>
  <script src="js/picker.js?v=2026-07-13k"></script>
  <script src="js/mappings.js?v=2026-07-13k"></script>
  <script src="js/examples.js?v=2026-07-13k"></script>
  <script src="js/quickstart.js?v=2026-07-13k"></script>
  <script src="js/tabs.js?v=2026-07-13k"></script>
  <script src="js/expr-engine.js?v=2026-07-13k"></script>
  <script src="js/expressions.js?v=2026-07-13k"></script>
  <script src="js/settings-json.js?v=2026-07-13k"></script>
  <script src="js/app.js?v=2026-07-13k"></script>
</body>
</html>
